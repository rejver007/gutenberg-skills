name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  php:
    # The repo ships one PHP asset and every scaffolded theme carries four
    # generated PHP files. Neither was checked by anything before this.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: php -l on everything this repo ships
        run: |
          find skills examples tools -name '*.php' -not -path '*/vendor/*' -print0 \
            | xargs -0 -r -n1 php -l

      - name: php -l on a freshly scaffolded theme
        run: |
          node tools/scaffold-theme.mjs \
            --input examples/agency-site/input/design-system.json \
            --out /tmp/php-check
          find /tmp/php-check -name '*.php' -print0 | xargs -0 -r -n1 php -l

      # php -l is syntax. This is the standard the code claims to follow.
      # Installed outside the repo on purpose: npm is the only dependency
      # manager a contributor needs to set up, and phpcs.xml.dist carries the
      # configuration either way. The install sequence lives in a script that
      # CONTRIBUTING.md calls too, so the documented one cannot drift from this.
      - name: WordPress Coding Standards
        run: |
          ./tools/install-phpcs.sh /tmp/phpcs
          /tmp/phpcs/vendor/bin/phpcs

      # The ruleset is named explicitly because these files sit outside the
      # repo, where phpcs would not find phpcs.xml.dist on its own.
      # --standard=WordPress skipped this repo's configuration entirely, which
      # is where the minimum WP version, the text domain and the prefixes are
      # set. Paths given on the command line override the ruleset's own <file>
      # elements, so only the scaffolded theme is scanned here.
      - name: the standard also passes on a freshly scaffolded theme
        run: /tmp/phpcs/vendor/bin/phpcs --standard=./phpcs.xml.dist -p /tmp/php-check

  pipeline:
    # The example is the regression surface: regenerate it from its inputs and
    # prove nothing drifted. A fresh checkout is also the only place the CRLF
    # trap shows up, which is why this runs separately from the unit tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: theme.json matches its design system
        run: |
          node tools/build-theme-json.mjs \
            --input examples/agency-site/input/design-system.json \
            --out examples/agency-site/expected/theme/theme.json \
            --check

      - name: the scaffold reproduces the committed theme
        # CLAUDE.md and templates/front-page.html are seeded once and then
        # authored by hand, so they are exactly the files this diff must skip.
        run: |
          node tools/scaffold-theme.mjs \
            --input examples/agency-site/input/design-system.json \
            --out /tmp/scaffold
          for f in style.css functions.php theme.json parts/header.html parts/footer.html templates/index.html; do
            diff -u "examples/agency-site/expected/theme/$f" "/tmp/scaffold/$f"
          done

      - name: every page of the example validates
        run: |
          node tools/validate-blocks.mjs \
            --theme examples/agency-site/expected/theme \
            --report examples/agency-site/input/buildability-report.md

  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Compare contents, not bytes. A zip embeds timestamps and compression
      # settings, so two correct archives of the same files differ byte for
      # byte. What matters is that the committed package contains the skill.
      - name: committed packages match the skills they contain
        run: |
          for pkg in dist/*.skill; do
            name="$(basename "$pkg" .skill)"
            rm -rf /tmp/unpack && mkdir -p /tmp/unpack
            unzip -q "$pkg" -d /tmp/unpack
            diff -r "skills/$name" "/tmp/unpack/$name"
            echo "ok: $pkg"
          done

      - name: every skill has a package
        run: |
          for dir in skills/*/; do
            [ -f "$dir/SKILL.md" ] || continue
            name="$(basename "$dir")"
            test -f "dist/$name.skill" || { echo "missing dist/$name.skill, run ./make-dist.sh"; exit 1; }
          done

      - name: make-dist.sh runs and packages every skill
        run: ./make-dist.sh
